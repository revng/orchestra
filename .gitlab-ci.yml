image: revng/revng-build-dependencies:latest

stages:
  - build
  - promotion

push-to-develop:
  stage: build
  script:
    - git clone "${ORCHESTRA_CONFIG_REPO_HTTP_URL:-https://github.com/revng/orchestra.git}"
    - cd orchestra
    - .orchestra/ci/ci.sh


push-to-master:
  tags:
    - mass-testing
  stage: promotion
  rules:
    # The $DO_NOT_RUN_THIS_JOB variable is never defined, so when gitlab
    # evaluates the `if` below it will always be false, effectively disabling
    # this job
    - if: $PUSHED_REF == "refs/heads/next-develop" && $DO_NOT_RUN_THIS_JOB
  script:
    - git clone --branch next-develop "${ORCHESTRA_CONFIG_REPO_HTTP_URL:-https://github.com/revng/orchestra.git}"
    - cd orchestra
    - .orchestra/ci/ci-regression.sh
