#@yaml/text-templated-strings
---
#@ def create_vc_component(
#@     name=None,
#@     triple=None,
#@     extract=None,
#@     bin=None,
#@     include=None,
#@     lib=None,
#@     debug_info=None,
#@ ):
toolchain/(@= name @)/vc:
  binary_archives: private
  builds:
    default:
      build_dependencies:
      - python
      configure: |
        INSTALL_PATH="lib/vc/(@= triple @)"
        mkdir -p "$BUILD_DIR"
        cd "$BUILD_DIR"
        mkdir -p lib64
        test -e lib || ln -s lib64 lib
        mkdir -p "$BUILD_DIR/$INSTALL_PATH"
        cd "$BUILD_DIR/$INSTALL_PATH"

        (@= extract @)

        # The wrappers only say what tells the toolchains apart; the work is
        # in the support scripts next to them.
        for SCRIPT in msvc-run msvc-create-wineprefix; do
            cp "$ORCHESTRA_DOTDIR/support/$SCRIPT" .
        done

        # Check the support scripts have the expected hash, so that orchestra
        # rebuilds this component whenever we change them
        sha256sum -c - <<'EOF'
        (@= msvc_run_sha @)  msvc-run
        (@= msvc_create_wineprefix_sha @)  msvc-create-wineprefix
        EOF

        cat > cl.exe <<'EOF'
        #!/usr/bin/env bash

        set -euo pipefail

        MSVC_TOOLCHAIN="$( cd -- "$( dirname -- "${BASH_SOURCE[0]:-$0}"; )" &> /dev/null && pwd 2> /dev/null; )";
        export MSVC_TOOLCHAIN
        export MSVC_BIN="(@= bin @)"
        export MSVC_PROGRAM="$(basename "$0")"
        export MSVC_ASSEMBLER="(@= "ml.exe" if triple.startswith("i386-") else "ml64.exe" @)"
        export INCLUDE="(@= ";".join(["$MSVC_TOOLCHAIN/" + path for path in include]) @)"
        export LIB="(@= ";".join(["$MSVC_TOOLCHAIN/" + path for path in lib]) @)"

        exec "$MSVC_TOOLCHAIN/msvc-run" "$@"
        EOF

        cp cl.exe dumpbin.exe
        cp cl.exe ml.exe
        cp cl.exe link.exe

        chmod +x cl.exe
        chmod +x dumpbin.exe
        chmod +x ml.exe
        chmod +x link.exe

        cd "$BUILD_DIR"
        mkdir -p bin

        for PROGRAM in cl dumpbin ml link; do
            cp "$ORCHESTRA_DOTDIR/support/msvc-dispatch" "bin/(@= triple @)-$PROGRAM"
        done

        sha256sum -c - <<'EOF'
        (@= msvc_dispatch_sha @)  bin/(@= triple @)-cl
        EOF

        chmod +x bin/(@= triple @)-cl
        chmod +x bin/(@= triple @)-dumpbin
        chmod +x bin/(@= triple @)-ml
        chmod +x bin/(@= triple @)-link

      install: |
        cd "$BUILD_DIR"

        cp -far --reflink=auto "$BUILD_DIR/"* "${DESTDIR}${ORCHESTRA_ROOT}/"

        (@ if not triple.startswith("aarch64-"): @)
        if test "$RUN_TESTS" -eq 1; then
          # Build in a directory of its own: `$BUILD_DIR` is reused across
          # invocations and all of its contents get installed, so a leftover
          # test binary would end up in the orchestra root.
          TEST_DIRECTORY="$(mktemp --tmpdir tmp.msvc-test.XXXXXXXXXX -d)"

          # Point the wrappers at a throw-away directory, so that we leave
          # nothing behind in the shared prefixes
          MSVC_WINEPREFIXES="$(mktemp --tmpdir tmp.msvc-wine-prefixes.XXXXXXXXXX -d)"
          export MSVC_WINEPREFIXES

          function cleanup() {
            # `wineserver --kill` fails when there is no server to kill; let
            # it, or we would skip the cleanup below and return its status
            if test -n "${WINEPREFIX:-}"; then
              wineserver --kill || true
            fi
            rm -rf "$MSVC_WINEPREFIXES" "$TEST_DIRECTORY"
          }
          trap cleanup EXIT

          cat > "$TEST_DIRECTORY/test.c" <<'EOF'
        #include <stdio.h>

        int main() {
          puts("Hello world!");
          return 0;
        }
        EOF

          CL="$PWD/bin/(@= triple @)-cl"
          cd "$TEST_DIRECTORY"

          (@ if debug_info: @)
          "$CL" test.c -nologo /DEBUG:FASTLINK /Zi
          (@ else: @)
          "$CL" test.c -nologo
          (@ end @)
          export WINEDEBUG=-all

          # Run the result in the very prefix the wrapper just built for
          # itself, the only one in there
          WINEPREFIX="$(find "$MSVC_WINEPREFIXES" -mindepth 1 -maxdepth 1 -type d)"
          export WINEPREFIX

          if [[ "(@= triple @)" =~ ^i386- ]]; then
            wine test.exe
          else
            wine64 test.exe
          fi
        fi
        (@ end @)

#@ end

#@overlay/match by=overlay.all, expects=1
#@overlay/match-child-defaults missing_ok=True
---
components:
  _: #@ template.replace(create_vc_component(**vc12_params()))
  _: #@ template.replace(create_vc_component(**vc13_params()))
  _: #@ template.replace(create_vc_component(**vc16_params()))
  _: #@ template.replace(create_vc_component(**vc19_32_params()))
  _: #@ template.replace(create_vc_component(**vc19_64_params()))
  _: #@ template.replace(create_vc_component(**vc19_arm64_params()))
