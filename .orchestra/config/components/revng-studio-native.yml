#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/create-component.lib.yml", "single_build_component")

#@yaml/text-templated-strings
---
#@ def revng_studio_native_args():
repository: revng-studio
binary_archives: private
dependencies:
- revng
- host-libcxx
build_dependencies:
- revng-studio-native-extension
- revng-theme
- vscode-electron
- revng-studio-example-binaries
configure: |
  mkdir -p "$BUILD_DIR"
install: |
  source "$ORCHESTRA_DOTDIR/support/vscode-common.sh"
  install_command "${SOURCE_DIR}/vscode/electron/ui.py"

  mkdir -p "${DESTDIR}${ORCHESTRA_ROOT}/share/revng-studio"
  cp -raT "${SOURCE_DIR}/logos" \
          "${DESTDIR}${ORCHESTRA_ROOT}/share/revng-studio/logos"

  INSTALL_DIR="${DESTDIR}${ORCHESTRA_ROOT}/share/vscode-electron"
  mkdir -p "$INSTALL_DIR"
  tar -xf "${ORCHESTRA_ROOT}/share/vscode-electron-vanilla.tar.xz" -C"$INSTALL_DIR"

  copy_extensions "$INSTALL_DIR/resources/app/extensions" \
                  share/vscode-extensions/revng-color-theme.vsix \
                  share/vscode-extensions/revng-node.vsix

  # Copy example binaries
  cp -raT "$ORCHESTRA_ROOT/share/revng-studio/binaries" \
          "$INSTALL_DIR/resources/app/extensions/revng/resources/binaries"

  # Copy product.json and icons to to INSTALL_DIR
  APP_DIR="$INSTALL_DIR/resources/app"
  cp -a "$SOURCE_DIR/vscode/electron/product.json" "$APP_DIR/product.json"
  cp -a "$SOURCE_DIR/logos/logo.png" "$APP_DIR/resources/linux/code.png"
  cp -a "$SOURCE_DIR/logos/logo.png" "$APP_DIR/resources/linux/code.png"
  cp -a "$SOURCE_DIR/logos/logo.svg" "$APP_DIR/out/media/code-icon.svg"
  cp -a "$SOURCE_DIR/logos/logo.svg" \
        "$APP_DIR/out/vs/workbench/browser/media/code-icon.svg"

  # Remove all extensions not specified in `product.json:.builtinExtensions`
  remove_extraneous_extensions "$APP_DIR/product.json" \
                               "$INSTALL_DIR/resources/app/extensions"
#@ end

#@overlay/match by=overlay.all, expects=1
#@overlay/match-child-defaults missing_ok=True
---
components:
  revng-studio-native: #@ single_build_component(**revng_studio_native_args())
