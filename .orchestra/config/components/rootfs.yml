---
#@ def create_rootfs_component(name, codename, architecture, url, operating_system, packages):
#@ if operating_system == "ubuntu":
#@   components = "main,restricted,universe,multiverse"
#@ elif operating_system == "debian":
#@   components = "main,contrib,non-free"
#@ end
rootfs/(@= name @):
  skip_post_install: true
  builds:
    default:
      build_dependencies:
        - debootstrap
      configure: |
        mkdir -p "$BUILD_DIR"

      install: |
        log() { echo "$@" >&2; }

        cd "$BUILD_DIR"

        rm -rf rootfs/

        log "Running debootstrap for (@= name @)..."
        DEBOOTSTRAP_DIR="$ORCHESTRA_ROOT/share/debootstrap" \
          fakeroot \
          "$ORCHESTRA_ROOT/bin/debootstrap" \
          --no-check-gpg \
          --arch="(@= architecture @)" \
          --components="(@= components @)" \
          --include="(@= packages @)" \
          --download-only \
          "(@= codename @)" \
          rootfs/ \
          "(@= url @)" || true

        log "Extracting .deb packages..."
        find rootfs -name "*.deb" | while read DEB_FILE; do
          mkdir -p temp
          cd temp
          ar x "../$DEB_FILE"
          cd ../rootfs
          if test -e "../temp/data.tar"*; then
            tar --skip-old-files -xaf "../temp/data.tar"*
          fi
          cd ..
          rm -rf temp
        done

        if test "$(find rootfs/ -name 'libc.so*' | wc -l)" -lt 1; then
          log "ERROR: debootstrap (@= name @) failed"
          exit 1
        fi

        # Cleanup: keep only symlinks, ELF files, /etc/ld.so.conf,
        # and files in /etc/ld.so.conf.d/
        log "Cleaning up non-ELF files..."
        find rootfs -not -type d | while read FILE; do
          if test -L "$FILE"; then
            continue
          fi

          RELATIVE_PATH="${FILE#rootfs}"

          if test "$RELATIVE_PATH" = "/etc/ld.so.conf"; then
            continue
          fi

          case "$RELATIVE_PATH" in
            /etc/ld.so.conf.d/*) continue ;;
          esac

          if head -c 4 "$FILE" 2>/dev/null | grep -q $'\x7fELF'; then
            continue
          fi

          rm -f "$FILE"
        done

        # Fix permissions before modifying symlinks
        chmod -R u+rwX rootfs/

        # Make all symlinks relative
        find rootfs -type l | while read LINK; do
          TARGET="$(readlink "$LINK")"
          if test "${TARGET#/}" != "$TARGET"; then
            LINK_DIR="$(dirname "$LINK")"
            RELATIVE_TARGET="$(realpath -m --relative-to="$LINK_DIR" "rootfs$TARGET")"
            ln -sfn "$RELATIVE_TARGET" "$LINK"
          fi
        done

        # Drop empty directories
        find rootfs -type d -empty -delete

        log "Rootfs (@= name @) ready."

        mkdir -p "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/linux/(@= name @)"
        cp -a rootfs/* "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/linux/(@= name @)/"
        chmod -R u+rwX "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/linux/(@= name @)/"
#@ end

#@ def create_container_rootfs_component(name, platform, url, keep_files):
rootfs/(@= name @):
  skip_post_install: true
  builds:
    default:
      build_dependencies:
        - skopeo
        - umoci
      configure: |
        mkdir -p "$BUILD_DIR"

      install: |
        log() { echo "$@" >&2; }

        cd "$BUILD_DIR"

        rm -rf rootfs
        rm -rf rootfs-oci

        log "Fetching (@= name @)..."
        skopeo \
          --override-os "(@= platform @)" \
          copy \
          "(@= url @)" \
          oci:rootfs-oci:latest

        log "Unpacking (@= name @)..."
        if ! umoci \
             raw \
             unpack \
             --rootless \
             --image rootfs-oci \
             rootfs; then
          rm -rf rootfs-oci
          exit 1
        fi

        find rootfs -maxdepth 3 -type d -exec chmod 755 {} \;

        rm -rf rootfs-oci

        log "Filtering rootfs to keep only: (@= ", ".join(keep_files) @)..."
        find rootfs -not -type d -not -type l \
          ! \( (@= " -o ".join(['-iname "' + f + '"' for f in keep_files]) @) \) \
          -delete

        # Fix permissions
        chmod -R u+rwX rootfs/

        # Drop empty directories
        find rootfs -type d -empty -delete

        log "Rootfs (@= name @) ready."

        mkdir -p "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/(@= platform @)/(@= name @)"
        cp -a rootfs/* "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/(@= platform @)/(@= name @)/"
        chmod -R u+rwX "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/(@= platform @)/(@= name @)/"
#@ end

#@ def create_wim_rootfs_component(name, url, hash, wim_path, keep_files):
rootfs/(@= name @):
  skip_post_install: true
  builds:
    default:
      configure: |
        mkdir -p "$BUILD_DIR"

      install: |
        log() { echo "$@" >&2; }

        cd "$BUILD_DIR"

        rm -rf rootfs

        log "Fetching (@= name @) ISO..."
        fetch.sh \
          --no-copy \
          --hash 'sha256-(@= hash @)' \
          '(@= url @)'

        ISO_FILE="${SOURCE_ARCHIVES}/$(basename '(@= url @)')"

        log "Extracting WIM from ISO..."
        7z x -y "$ISO_FILE" "(@= wim_path @)"

        log "Extracting rootfs from WIM..."
        7z x -y "(@= wim_path @)" -orootfs

        rm -f "(@= wim_path @)"

        # Flatten the image index prefix (1/) away
        if test -d rootfs/1; then
          mv rootfs/1/* rootfs/
          rmdir rootfs/1
        fi

        log "Filtering rootfs to keep only: (@= ", ".join(keep_files) @)..."
        find rootfs -not -type d -not -type l \
          ! \( (@= " -o ".join(['-iname "' + f + '"' for f in keep_files]) @) \) \
          -delete

        # Fix permissions
        chmod -R u+rwX rootfs/

        # Drop empty directories
        find rootfs -type d -empty -delete

        log "Rootfs (@= name @) ready."

        mkdir -p "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/windows/(@= name @)"
        cp -a rootfs/* "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/windows/(@= name @)/"
        chmod -R u+rwX "${DESTDIR}${ORCHESTRA_ROOT}/share/roots/windows/(@= name @)/"
#@ end

#@ def create_debug_info_component(name, codename=None, architecture=None, url=None, operating_system=None, packages=None):
rootfs/(@= name @)/debug-info:
  skip_post_install: true
  builds:
    default:
      build_dependencies:
        - fetch-debuginfo
        - rootfs/(@= name @)
      configure: |
        mkdir -p "$BUILD_DIR"

      install: |
        function log() {
          echo "$@" > /dev/stderr
        }

        cd "$BUILD_DIR"

        ROOTFS_DIR="$ORCHESTRA_ROOT/share/roots/linux/(@= name @)"

        log "Fetching debug info for (@= name @)..."
        mkdir -p .flags

        cat > build.ninja <<EOF
        rule fetch_debuginfo
          command = fetch-debuginfo -o '$BUILD_DIR/cache' \$in || true && touch \$out
          description = fetch-debuginfo \$in
        EOF

        find "$ROOTFS_DIR" -type f \( ! -path "$ROOTFS_DIR/symbols-cache/*" \) | \
        while read -r ELF_FILE; do
          if head -c 4 "$ELF_FILE" 2>/dev/null | grep -q $'\x7fELF'; then
            HASH=$(sha256sum <<< "$ELF_FILE" | cut -d' ' -f1)
            ESCAPED=$(sed -e 's| |$ |g' <<< "$ELF_FILE")
            echo "build .flags/$HASH: fetch_debuginfo $ESCAPED" >> build.ninja
          fi
        done

        (@= ninja @)
        log "Debug info fetching complete."

        SYMBOLS_SRC="$BUILD_DIR/cache/debug-symbols/elf"
        SYMBOLS_DST="${DESTDIR}${ORCHESTRA_ROOT}/share/roots/linux/(@= name @)/symbols-cache"

        if test -d "$SYMBOLS_SRC"; then
          mkdir -p "$SYMBOLS_DST"
          cp -a "$SYMBOLS_SRC"/* "$SYMBOLS_DST/"
        fi
#@ end

#@overlay/match by=overlay.all, expects=1
#@overlay/match-child-defaults missing_ok=True
---
components:
  #@ for configuration in rootfs_configurations():
  _: #@ template.replace(create_rootfs_component(**configuration))
  _: #@ template.replace(create_debug_info_component(**configuration))
  #@ end
  #@ for configuration in container_configurations():
  _: #@ template.replace(create_container_rootfs_component(**configuration))
  #@ end
  #@ for configuration in wim_configurations():
  _: #@ template.replace(create_wim_rootfs_component(**configuration))
  #@ end
