#@ load("@ytt:data", "data")
#@ load("@ytt:overlay", "overlay")
#@ load("/lib/vscode-extension.lib.yml", "vscode_extension")

#@yaml/text-templated-strings
---
#@ def revng_ui_args(package_script):
repository: revng-ui
license: LICENSE.md
binary_archives: private
build_dependencies:
- revng
development_packages:
- revng-model
#! Since the vscode_extension machine does not run a proper build system we
#! just copy the yaml schema directory in the build directory
pre_npm_install: |
  cp -a "${ORCHESTRA_ROOT}/share/revng/pipeline/pipeline-description-schema.yml" .
package_script: (@= package_script @)
#@ end

#@overlay/match by=overlay.all, expects=1
#@overlay/match-child-defaults missing_ok=True
---
components:
  revng-ui-web-extension: #@ vscode_extension(**revng_ui_args("package-web"))
  revng-ui-native-extension: #@ vscode_extension(**revng_ui_args("package-native"))
